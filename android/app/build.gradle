plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace = 'live.geargrid.phone'
    compileSdk = 35

    defaultConfig {
        applicationId 'live.geargrid.phone'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            // callScreenTokens.json is copied here by scripts/vendor-contracts.sh (shared with the web designer).
            assets.srcDirs += ['src/main/shared-assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'

    // Capacitor Android runtime (linked via settings.gradle after npm install)
    if (findProject(':capacitor-android') != null) {
        implementation project(':capacitor-android')
    }

    // Phone fingerprint / face / PIN prompt for the app lock
    implementation 'androidx.biometric:biometric:1.1.0'

    // Encrypted credential storage
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Room local database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // WorkManager background sync & retry outbox
    implementation 'androidx.work:work-runtime-ktx:2.10.0'

    // HTTP & JSON & Coroutines
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Firebase Cloud Messaging (Slice B)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// Product owner drops google-services.json here for FCM push builds (Slice B)
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
