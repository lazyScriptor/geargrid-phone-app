pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'geargrid-phone-app'
include ':app'
if (file('../node_modules/@capacitor/android/capacitor').exists()) {
    include ':capacitor-android'
    project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')
}
